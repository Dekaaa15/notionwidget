<!DOCTYPE html>
<html>
<head>
	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
	<!-- Google Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700&display=swap" rel="stylesheet">
	<!-------->
	<style>
		* {
			margin: 0;
			padding: 0;
			-webkit-box-sizing: border-box;
			box-sizing: border-box;
		}

		body {
			background-color: #181818;
		}

		.navMenu {
			font-family: 'Advent Pro', sans-serif;
			padding: 8px;
			text-align: center;
			margin: 7px auto;
			width: fit-content;
			background-color: #181818;
		}

		.navMenu a {
			color: #FFFFFF;
			text-decoration: none;
			display: inline-block;
			padding: 8px;
		}

		.background {
			background-color: #181818;
		}

		.border {
			border: 2px solid #997950;
			border-radius: 10px;
		}

		.navMenu a:hover {
			color: #997950;
		}
	</style>
</head>

<body>
	<nav class="navMenu border">
		<a id="home" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-house-fire"></i> Home</a>
		<a id="financial income" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-money-bill-trend-up"></i> Financial Income</a>
		<a id="expenses tracker" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-money-bill-transfer"></i> Expenses Tracker</a>
		<a id="yields" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-vault"></i> Yields</a>
		<a id="the burn" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-scale-unbalanced-flip"></i> The Burn</a>
		<a id="asset pools" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-money-bill-wave"></i> Asset Pools</a>
		<a id="locket funds" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-piggy-bank"></i> Locket Funds</a>
		<a id="core target" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-file-invoice-dollar"></i> Core Target</a>
	</nav>

	<script>
		let direction = "vertical";

		if (direction === "vertical") {
			document.head.insertAdjacentHTML("beforeend", `<style>.navMenu a {display: block; text-align:left; margin:7px}
					i {width:15px; margin-right:10px}
					.navMenu {margin:10px}
				</style>`)
		}

		function navigate(id) {

			if (id == 'home')
				window.open("https://app.notion.com/p/Paper-Trail-3c18509d73ac80ecb0ebc40d4f11e250?pvs=12", '_blank').focus();
			else if (id == "financial income")
				window.open("https://app.notion.com/p/3c18509d73ac805baf80cdfb63aaccdf?v=3c18509d73ac807ea29d000c3a814142", '_blank').focus();
			else if (id == "expenses tracker")
				window.open("https://app.notion.com/p/3c18509d73ac8096ac50ffdfd43037ba?v=49b8509d73ac8292827108f7ad3393e3", '_blank').focus();
			else if (id == "yields")
				window.open("https://app.notion.com/p/3c18509d73ac8035a5afffd0f701e111?v=3c18509d73ac80edb9cc000c89874dd8", '_blank').focus();
			else if (id == "the burn")
				window.open("https://app.notion.com/p/3c18509d73ac805eacb6cc657e997533?v=7ed8509d73ac8357a9c308be18d219b8", '_blank').focus();
			else if (id == "asset pools")
				window.open("https://app.notion.com/p/3c18509d73ac80c188d6d003b3e7e662?v=3c28509d73ac80cb8926000ce57aef0f", '_blank').focus();
			else if (id == "locket funds")
				window.open("https://app.notion.com/p/3c28509d73ac80e7a57be16a76f80dfa?v=3c28509d73ac80fb963f000caf16b230", '_blank').focus();
			else if (id == "core target")
				window.open("https://app.notion.com/p/3c28509d73ac80dea5a1ca9e8e20c9b7?v=3c28509d73ac80a78a3f000ccbe5a931", '_blank').focus();
		}
	</script>
</body>
</html>
